name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hungle2006&show_icons=true&theme=tokyonight&hide=contribs,prs,issues
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hungle2006&layout=compact&langs_count=8&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Gold58-ConvNeXt2.5D
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Gold58-ConvNeXt2.5D&theme=radical
          path: profile/pin-gold58.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate knee-detection
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=knee-detection&theme=merko
          path: profile/pin-knee-detection.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate BrainModel
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=BrainModel&theme=gruvbox
          path: profile/pin-brainmodel.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Lung_Multi-taskLearning
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Lung_Multi-taskLearning&theme=dark
          path: profile/pin-lung-multitask.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Diabetes-AI
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Diabetes-AI&theme=onedark
          path: profile/pin-diabetes-ai.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate ICD10_Model
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=ICD10_Model&theme=cobalt
          path: profile/pin-icd10-model.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Deep-Image-Retrieval-using-DINOv2-OpenCLIP-ConvNeXt-and-LightGlue
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Deep-Image-Retrieval-using-DINOv2-OpenCLIP-ConvNeXt-and-LightGlue&theme=synthwave
          path: profile/pin-deep-image-retrieval.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate anomaly_3branch
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=anomaly_3branch&theme=highcontrast
          path: profile/pin-anomaly-3branch.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Leaf_Disease
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Leaf_Disease&theme=dracula
          path: profile/pin-leaf-disease.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate OmniGS
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=OmniGS&theme=tokyonight
          path: profile/pin-omnigs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Mip-Splatting-Fine-tuning
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Mip-Splatting-Fine-tuning&theme=radical
          path: profile/pin-mip-splatting.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate gaussian-splatting-LPIPS-Fine-tuning
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=gaussian-splatting-LPIPS-Fine-tuning&theme=merko
          path: profile/pin-gaussian-lpips.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate R-ViHSDModel
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=R-ViHSDModel&theme=gruvbox
          path: profile/pin-r-vihsd.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate VietnameseMulti-scale-CNN
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=VietnameseMulti-scale-CNN&theme=dark
          path: profile/pin-vietnamese-cnn.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate lfm-serving
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=lfm-serving&theme=onedark
          path: profile/pin-lfm-serving.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate speedLfmServing
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=speedLfmServing&theme=cobalt
          path: profile/pin-speed-lfm-serving.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate ARC
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=ARC&theme=synthwave
          path: profile/pin-arc.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Traffic_AV
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=hungle2006&repo=Traffic_AV&theme=highcontrast
          path: profile/pin-traffic-av.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changes."
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push
